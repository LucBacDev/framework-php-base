[INPUT]
    Name              tail
    Tag               apache.error_log
    Path              /var/log/httpd/error_log.*
    DB                /var/log/apache2_error.db
    Path_Key          filename
    Parser            apache_error
    Mem_Buf_Limit     8MB
    Skip_Long_Lines   On
    Refresh_Interval  30

[INPUT]
    Name              tail
    Tag               apache.access_log
    Path              /var/log/httpd/access_log.*
    DB                /var/log/apache2_access.db
    Path_Key          filename
    Parser            apache2
    Mem_Buf_Limit     8MB
    Skip_Long_Lines   On
    Refresh_Interval  30

[INPUT]
    Name              tail
    Tag               dicomnet_log
    Path              /pacs/server/log/server.log
    DB                /var/log/dicomnet.db
    Path_Key          filename
    multiline.parser  dicom
    Mem_Buf_Limit     8MB
    Refresh_Interval  30

[FILTER]
    Name              lua
    Match             dicomnet_log
    Script            /var/www/html/Module/company/log/conf/extract_fields.lua
    Call              extract_fields