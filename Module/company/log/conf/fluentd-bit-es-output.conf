@SET es_host=elasticsearch
@SET es_port=9200
@SET es_user=elastic
@SET es_passwd=MyElasticPassword_678

[OUTPUT]
    Name es
    Match apache.access_log
    Host ${es_host}
    Port ${es_port}
    Index apache.access_log
    HTTP_User ${es_user}
    HTTP_Passwd ${es_passwd}

[OUTPUT]
    Name es
    Match apache.error_log
    Host ${es_host}
    Port ${es_port}
    Index apache.error_log
    HTTP_User ${es_user}
    HTTP_Passwd ${es_passwd}

[OUTPUT]
    Name es
    Match pacs.*
    Host ${es_host}
    Port ${es_port}
    Index pacs_log
    HTTP_User ${es_user}
    HTTP_Passwd ${es_passwd}

[OUTPUT]
    Name es
    Match audit_log
    Host ${es_host}
    Port ${es_port}
    Index audit_log
    HTTP_User ${es_user}
    HTTP_Passwd ${es_passwd}

[OUTPUT]
    Name es
    Match dicomnet_log
    Host ${es_host}
    Port ${es_port}
    Index dicomnet_log
    HTTP_User ${es_user}
    HTTP_Passwd ${es_passwd}