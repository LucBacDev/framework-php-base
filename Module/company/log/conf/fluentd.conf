<source>
  @type forward
  port 24284
  bind 0.0.0.0
</source>

<match apache.**>
  @type elasticsearch
  logstash_format false
  host 172.16.20.133 #(optional; default="localhost")
  port 9200 #(optional; default=9200)
  index_name ${tag} #(optional; default=fluentd)
  type_name _doc #(optional; default=fluentd)
  user elastic
  password MyElasticPassword_678
</match>

<match **>
  @type elasticsearch
  logstash_format false
  host 172.16.20.133 #(optional; default="localhost")
  port 9200 #(optional; default=9200)
  index_name server_log #(optional; default=fluentd)
  type_name _doc #(optional; default=fluentd)
  user elastic
  password MyElasticPassword_678
</match>