<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>KanbanPro - React Kanban Board</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Manrope:wght@600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- React and Babel -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- SortableJS -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
        .kanban-column { min-width: 280px; max-width: 320px; }
        .sortable-ghost { opacity: 0.4; background: #f1f5f9 !important; border: 2px dashed #cbd5e1 !important; }
        .sortable-chosen { cursor: grabbing !important; }
        .sortable-drag { cursor: grabbing !important; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1) !important; opacity: 1 !important; background: white !important; }
        .kanban-list { min-height: 100px; }
        
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); }
</style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-bright": "#f8f9ff",
                      "on-primary": "#ffffff",
                      "primary": "#00685f",
                      "primary-container": "#008378",
                      "surface-container": "#e5eeff",
                      "on-surface": "#0b1c30",
                      "error": "#ba1a1a",
              },
              "spacing": {
                      "card-padding": "12px",
                      "column-width": "280px",
                      "gutter": "16px",
                      "margin-page": "32px",
              },
              "fontFamily": {
                      "label-bold": ["Inter"],
                      "headline-md": ["Manrope"],
                      "display-lg": ["Manrope"],
              },
            },
          },
        }
</script>
</head>
<body class="bg-surface-bright text-on-surface">
<div id="root"></div>
<script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SITE_ID = '1';
        const API_ROOT_URL = `http://localhost:8080/${SITE_ID}/rest/task`;

        // Default structure
        const INITIAL_COLUMNS = {
            STATUS_NEW: { id: 'STATUS_NEW', title: 'TO DO', items: [] },
            STATUS_IN_PROGRESS: { id: 'STATUS_IN_PROGRESS', title: 'IN PROGRESS', items: [] },
            STATUS_PENDING_APPROVAL: { id: 'STATUS_PENDING_APPROVAL', title: 'PENDING APPROVAL', items: [] },
            STATUS_DONE: { id: 'STATUS_DONE', title: 'DONE', items: [] }
        };

        const apiCall = async (endpoint, options = {}) => {
            try {
                const res = await fetch(`${API_ROOT_URL}${endpoint}`, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    }
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'API Error');
                return data;
            } catch (e) {
                alert(e.message);
                throw e;
            }
        };

        const TaskModal = ({ isOpen, onClose, onSubmit, taskToEdit = null, onDelete }) => {
            if (!isOpen) return null;
            const [title, setTitle] = useState(taskToEdit?.title || '');
            const [description, setDescription] = useState(taskToEdit?.description || '');
            const [priority, setPriority] = useState(taskToEdit?.priority || 'medium');
            const [type, setType] = useState(taskToEdit?.type || 'Feature');
            const [progress, setProgress] = useState(taskToEdit?.progress || 0);
            const [deadline, setDeadline] = useState(taskToEdit?.deadline ? taskToEdit.deadline.substring(0, 16) : '');

            const isEdit = !!taskToEdit;

            const handleSubmit = (e) => {
                e.preventDefault();
                onSubmit({ title, description, priority, type, progress, deadline });
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay">
                    <div className="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col">
                        <div className="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                            <h2 className="text-lg font-bold text-slate-800">{isEdit ? 'Edit Task' : 'Create New Task'}</h2>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                                <span className="material-symbols-outlined">close</span>
                            </button>
                        </div>
                        <div className="p-6 overflow-y-auto max-h-[70vh]">
                            <form id="taskForm" onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1">Title</label>
                                    <input required value={title} onChange={e => setTitle(e.target.value)} type="text" className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none" />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1">Description</label>
                                    <textarea value={description} onChange={e => setDescription(e.target.value)} rows="3" className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none"></textarea>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-1">Priority</label>
                                        <select value={priority} onChange={e => setPriority(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none">
                                            <option value="low">Low</option>
                                            <option value="medium">Medium</option>
                                            <option value="high">High</option>
                                            <option value="bolt">Critical</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-1">Type</label>
                                        <select value={type} onChange={e => setType(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none">
                                            <option value="Feature">Feature</option>
                                            <option value="Bug">Bug</option>
                                            <option value="Refactor">Refactor</option>
                                            <option value="Design">Design</option>
                                            <option value="Docs">Docs</option>
                                        </select>
                                    </div>
                                    {isEdit && (
                                        <div>
                                            <label className="block text-sm font-semibold text-slate-700 mb-1">Progress (%)</label>
                                            <input type="number" min="0" max="100" value={progress} onChange={e => setProgress(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none" />
                                        </div>
                                    )}
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-1">Deadline</label>
                                        <input type="datetime-local" value={deadline} onChange={e => setDeadline(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none" />
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div className="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-between items-center">
                            {isEdit ? (
                                <button type="button" onClick={() => onDelete(taskToEdit.id)} className="px-4 py-2 text-error font-semibold hover:bg-red-50 rounded-lg transition-colors">Delete Task</button>
                            ) : <div></div>}
                            <div className="flex gap-2">
                                <button type="button" onClick={onClose} className="px-4 py-2 text-slate-600 font-semibold hover:bg-slate-200 rounded-lg transition-colors">Cancel</button>
                                <button type="submit" form="taskForm" className="px-4 py-2 bg-primary text-white font-semibold rounded-lg hover:bg-primary-container transition-colors">
                                    {isEdit ? 'Save Changes' : 'Create Task'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Card = ({ item, columnId, onClick }) => {
            const isDone = columnId === 'STATUS_DONE';
            
            // Map types to colors
            const typeColorMap = {
                'Feature': 'blue',
                'Bug': 'red',
                'Refactor': 'amber',
                'Design': 'teal',
                'Docs': 'slate'
            };
            const typeColor = typeColorMap[item.type] || 'blue';

            return (
                <div 
                    data-id={item.id}
                    className={`${isDone ? 'bg-slate-50 border-slate-100' : 'bg-white border-slate-200'} border p-card-padding rounded-lg shadow-sm hover:shadow-md transition-all cursor-grab active:cursor-grabbing group`}
                    onClick={() => onClick(item)}
                >
                    <div className="flex justify-between items-start mb-2">
                        <span className={`px-2 py-0.5 bg-${typeColor}-50 text-${typeColor}-600 rounded text-[10px] font-bold uppercase tracking-wider`}>
                            {item.type || 'Task'}
                        </span>
                        {isDone ? (
                            <span className="material-symbols-outlined text-teal-600 text-sm" style={{ fontVariationSettings: "'FILL' 1" }}>check_circle</span>
                        ) : (
                            <span className="material-symbols-outlined text-slate-300 transition-opacity drag-handle">drag_indicator</span>
                        )}
                    </div>
                    <h3 className={`font-label-bold mb-1 ${isDone ? 'text-slate-500 line-through' : 'text-slate-900'}`}>
                        {item.title}
                    </h3>
                    {item.description && (
                        <p className="text-slate-500 text-[12px] line-clamp-2 mb-3">{item.description}</p>
                    )}
                    <div className="flex items-center justify-between mt-4">
                        <div className="flex items-center gap-2">
                            {item.priority === 'high' && <span className="material-symbols-outlined text-error text-sm" style={{ fontVariationSettings: "'FILL' 1" }}>priority_high</span>}
                            {item.priority === 'low' && <span className="material-symbols-outlined text-slate-400 text-sm">low_priority</span>}
                            {item.priority === 'bolt' && <span className="material-symbols-outlined text-error text-sm" style={{ fontVariationSettings: "'FILL' 1" }}>bolt</span>}
                            {item.priority === 'medium' && <span className="material-symbols-outlined text-amber-500 text-sm">schedule</span>}
                            
                            <span className="text-slate-400 text-[11px] font-medium">
                                {item.deadline ? new Date(item.deadline).toLocaleDateString() : 'No deadline'}
                            </span>
                        </div>
                        <div className="flex -space-x-1.5 items-center">
                            {item.progress !== undefined && (
                                <span className="text-xs font-bold text-teal-600 mr-2">{item.progress}%</span>
                            )}
                            {item.assignee && (
                                <div className="w-6 h-6 rounded-full bg-teal-100 flex items-center justify-center text-[10px] font-bold text-teal-700">
                                    {item.assignee.substring(0, 2).toUpperCase()}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const Column = ({ column, onUpdate, onCardClick }) => {
            const listRef = useRef(null);

            useEffect(() => {
                let sortable;
                if (listRef.current) {
                    sortable = new Sortable(listRef.current, {
                        group: 'kanban',
                        animation: 150,
                        ghostClass: 'sortable-ghost',
                        chosenClass: 'sortable-chosen',
                        dragClass: 'sortable-drag',
                        handle: '.drag-handle',
                        onEnd: (evt) => {
                            // Let the parent handle logic and data refetching
                            onUpdate(evt);
                        }
                    });
                }
                return () => {
                    if (sortable) sortable.destroy();
                };
            }, [onUpdate]);

            return (
                <div className="kanban-column flex-shrink-0 flex flex-col">
                    <div className="flex items-center justify-between mb-4 sticky top-0 bg-surface-bright py-2 z-10">
                        <div className="flex items-center gap-2">
                            <span className="font-label-caps text-slate-500 uppercase font-bold">{column.title}</span>
                            <span className={`w-5 h-5 ${column.id === 'STATUS_IN_PROGRESS' ? 'bg-teal-100 text-teal-700' : 'bg-slate-200 text-slate-600'} rounded-full flex items-center justify-center text-[10px] font-bold`}>
                                {column.items.length}
                            </span>
                        </div>
                    </div>
                    <div 
                        ref={listRef}
                        className={`kanban-list flex flex-col gap-3 ${column.id === 'STATUS_DONE' ? 'opacity-75 grayscale-[0.2]' : ''}`} 
                        data-column-id={column.id}
                    >
                        {column.items.map(item => (
                            <Card key={item.id} item={item} columnId={column.id} onClick={onCardClick} />
                        ))}
                    </div>
                </div>
            );
        };

        const KanbanBoard = () => {
            const [boardData, setBoardData] = useState(INITIAL_COLUMNS);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingTask, setEditingTask] = useState(null);

            const fetchTasks = async () => {
                try {
                    const data = await apiCall('/tasks');
                    // data format expected: array of tasks
                    const newBoard = JSON.parse(JSON.stringify(INITIAL_COLUMNS));
                    if (Array.isArray(data)) {
                        data.forEach(task => {
                            const status = task.status || 'STATUS_NEW';
                            if (newBoard[status]) {
                                newBoard[status].items.push(task);
                            } else {
                                // Default to NEW if unknown
                                newBoard['STATUS_NEW'].items.push(task);
                            }
                        });
                    }
                    setBoardData(newBoard);
                } catch (e) {
                    console.error("Failed to load tasks", e);
                }
            };

            useEffect(() => {
                fetchTasks();
            }, []);

            const handleDragEnd = async (evt) => {
                const { from, to, oldIndex, newIndex, item } = evt;
                const fromColId = from.getAttribute('data-column-id');
                const toColId = to.getAttribute('data-column-id');

                if (fromColId === toColId) {
                    // Sorting not fully supported in backend yet, just refetch to revert or keep local
                    return fetchTasks();
                }

                const taskId = item.getAttribute('data-id');

                try {
                    if (fromColId === 'STATUS_NEW' && toColId === 'STATUS_IN_PROGRESS') {
                        await apiCall(`/tasks/${taskId}/start`, { method: 'POST' });
                    } else if (fromColId === 'STATUS_IN_PROGRESS' && toColId === 'STATUS_PENDING_APPROVAL') {
                        await apiCall(`/tasks/${taskId}/submit`, { method: 'POST' });
                    } else if (fromColId === 'STATUS_PENDING_APPROVAL' && toColId === 'STATUS_DONE') {
                        await apiCall(`/tasks/${taskId}/approve`, { method: 'POST' });
                    } else if (fromColId === 'STATUS_PENDING_APPROVAL' && toColId === 'STATUS_IN_PROGRESS') {
                        await apiCall(`/tasks/${taskId}/rework`, { method: 'POST' });
                    } else {
                        throw new Error('Invalid workflow transition');
                    }
                    fetchTasks();
                } catch (e) {
                    console.error("Transition failed", e);
                    fetchTasks(); // Revert
                }
            };

            const handleCreateOrUpdateTask = async (taskData) => {
                try {
                    if (editingTask) {
                        // Update Progress if changed
                        if (taskData.progress !== editingTask.progress) {
                            await apiCall(`/tasks/${editingTask.id}/progress`, {
                                method: 'POST',
                                body: JSON.stringify({ progress: taskData.progress, comment: "Updated via Kanban" })
                            });
                        }
                        // Update Deadline if changed
                        if (taskData.deadline !== editingTask.deadline) {
                            await apiCall(`/tasks/${editingTask.id}/deadline`, {
                                method: 'PATCH',
                                body: JSON.stringify({ deadline: taskData.deadline })
                            });
                        }
                        // Note: Other fields might need generic PUT /tasks/{id} which isn't defined explicitly, skipping for now.
                    } else {
                        // Create
                        await apiCall('/tasks', {
                            method: 'POST',
                            body: JSON.stringify(taskData)
                        });
                    }
                    setIsModalOpen(false);
                    setEditingTask(null);
                    fetchTasks();
                } catch (e) {
                    console.error("Save failed", e);
                }
            };

            const handleDeleteTask = async (taskId) => {
                if (confirm('Are you sure you want to delete this task?')) {
                    try {
                        await apiCall(`/tasks/${taskId}`, { method: 'DELETE' });
                        setIsModalOpen(false);
                        setEditingTask(null);
                        fetchTasks();
                    } catch (e) {
                        console.error("Delete failed", e);
                    }
                }
            };

            const openCreateModal = () => {
                setEditingTask(null);
                setIsModalOpen(true);
            };

            const openEditModal = (task) => {
                setEditingTask(task);
                setIsModalOpen(true);
            };

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* SideNavBar */}
                    <aside className="fixed left-0 top-0 h-full w-64 flex flex-col bg-slate-50 border-r border-slate-200 z-20">
                        <div className="px-6 py-8">
                            <div className="text-xl font-extrabold text-teal-600 tracking-tight font-manrope">KanbanPro</div>
                            <div className="text-[10px] uppercase tracking-widest text-slate-400 font-bold mt-1">Enterprise</div>
                        </div>
                        <nav className="flex-1 px-4 space-y-1">
                            <a className="flex items-center gap-3 px-3 py-2 text-slate-500 hover:text-slate-900 hover:bg-slate-100 transition-colors duration-200 font-manrope text-sm font-medium rounded-lg" href="#">
                                <span className="material-symbols-outlined">folder</span>
                                <span>Projects</span>
                            </a>
                            <a className="flex items-center gap-3 px-3 py-2 text-teal-600 bg-teal-50/50 font-semibold border-r-2 border-teal-600 font-manrope text-sm rounded-l-lg" href="#">
                                <span className="material-symbols-outlined">dashboard</span>
                                <span>Boards</span>
                            </a>
                            <a className="flex items-center gap-3 px-3 py-2 text-slate-500 hover:text-slate-900 hover:bg-slate-100 transition-colors duration-200 font-manrope text-sm font-medium rounded-lg" href="#">
                                <span className="material-symbols-outlined">filter_alt</span>
                                <span>Filters</span>
                            </a>
                        </nav>
                        <div className="p-4 mt-auto">
                            <button onClick={openCreateModal} className="w-full flex items-center justify-center gap-2 bg-primary text-on-primary py-2.5 rounded-lg font-bold transition-all hover:opacity-90 shadow-md">
                                <span className="material-symbols-outlined text-sm">add</span>
                                Create Task
                            </button>
                        </div>
                    </aside>

                    <div className="flex-1 ml-64 overflow-y-auto bg-slate-50/50 relative">
                        {/* TopNavBar */}
                        <header className="sticky top-0 z-10 flex justify-between items-center px-6 h-16 bg-white/80 backdrop-blur-md border-b border-slate-200">
                            <div className="flex items-center gap-4 flex-1">
                                <div className="relative w-full max-w-md">
                                    <span className="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">search</span>
                                    <input className="w-full pl-10 pr-4 py-2 bg-slate-100/50 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/20 transition-all outline-none" placeholder="Search tasks, boards..." type="text"/>
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <button className="p-2 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">
                                    <span className="material-symbols-outlined">notifications</span>
                                </button>
                                <div className="h-6 w-px bg-slate-200 mx-2"></div>
                                <img alt="User" className="w-8 h-8 rounded-full border-2 border-white shadow-sm" src="https://ui-avatars.com/api/?name=Admin+User&background=0D8ABC&color=fff"/>
                            </div>
                        </header>

                        <main className="p-margin-page">
                            <div className="mb-8 flex justify-between items-end">
                                <div>
                                    <nav className="flex items-center gap-2 text-slate-400 text-[11px] font-bold uppercase tracking-widest mb-2">
                                        <span>PROJECTS</span>
                                        <span className="material-symbols-outlined text-[12px]">chevron_right</span>
                                        <span>TASK MANAGEMENT</span>
                                    </nav>
                                    <h1 className="font-display-lg text-3xl font-bold text-on-surface">Kanban Board</h1>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => fetchTasks()} className="flex items-center gap-1 text-sm font-semibold text-slate-500 hover:text-slate-800 transition-colors bg-white border border-slate-200 px-3 py-1.5 rounded-lg">
                                        <span className="material-symbols-outlined text-sm">refresh</span> Refresh
                                    </button>
                                </div>
                            </div>

                            <div className="flex gap-gutter overflow-x-auto pb-8 items-start min-h-[60vh]">
                                {Object.values(boardData).map(column => (
                                    <Column 
                                        key={column.id} 
                                        column={column} 
                                        onUpdate={handleDragEnd} 
                                        onCardClick={openEditModal}
                                    />
                                ))}
                            </div>
                        </main>
                    </div>
                    
                    <TaskModal 
                        isOpen={isModalOpen} 
                        onClose={() => setIsModalOpen(false)} 
                        onSubmit={handleCreateOrUpdateTask}
                        taskToEdit={editingTask}
                        onDelete={handleDeleteTask}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<KanbanBoard />);
</script>
</body></html>
